name: Prepare independent site copy
on:
  push:
    paths: ['.github/hero-photo.b64', '.github/bootstrap.py', '.github/workflows/prepare-site.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: initialize-site
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Copy verified original files and apply changes
        shell: bash
        run: |
          if [ -f index.html ]; then
            echo 'Site files already present; validating only.' | tee /tmp/site-copy.log
          else
            python3 .github/bootstrap.py 2>&1 | tee /tmp/site-copy.log
          fi
      - name: Validate site
        run: |
          node --check script.js
          python3 - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text()
          assert html.count('https://t.me/ssh1ck') == 2
          assert html.count('https://t.me/damn1luck') >= 4
          assert 'Не аффилирован с Garena' in html
          for src in re.findall(r'(?:src|href)="([^"#]+)"', html):
              if not src.startswith(('https:', 'http:')):
                  assert Path(src).is_file(), src
          PY
      - name: Save complete standalone site
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html styles.css script.js assets
          if ! git diff --cached --quiet; then
            git commit -m "Copy original site, replace hero photo, add guild officer"
            git push origin main
          fi
      - name: Record result
        if: always()
        env:
          COPY_RESULT: ${{ job.status }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          printf 'Result: %s\n' "$COPY_RESULT" > .github/preparation-status.txt
          cat /tmp/site-copy.log >> .github/preparation-status.txt || true
          git add .github/preparation-status.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Record site preparation result'
            git push origin main
          fi
