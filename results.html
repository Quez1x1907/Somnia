<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Результаты КВ / мясо — СОМНИЯ · Free Fire</title>
  <meta name="description" content="Последние результаты гильдии СОМНИИ в мясах и клановых войнах Free Fire. Обновляется из нашего ТГК.">
  <meta name="theme-color" content="#050608">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Результаты КВ / мясо — СОМНИЯ">
  <meta property="og:description" content="Последние матчи гильдии СОМНИИ против других гильдий.">
  <meta property="og:image" content="https://somnia-guild.pages.dev/assets/og.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,400;1,500&family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="updates.css">
</head>
<body>

  <header class="nav nav--scrolled">
    <div class="nav__inner">
      <a class="nav__brand" href="index.html" aria-label="СОМНИЯ — на главную">
        <img class="nav__logo" src="assets/emblem.png" alt="Эмблема гильдии СОМНИЯ — волк">
        <span class="nav__name">Сомния</span>
      </a>
      <nav class="nav__links nav__links--static" aria-label="Навигация">
        <a href="index.html" class="nav__link">На главную</a>
        <a href="index.html#glossary" class="nav__link">КВ и мясо</a>
        <a class="btn btn--sm btn--primary" href="https://t.me/somni1aa" target="_blank" rel="noopener">Наш ТГК</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-hero">
      <div class="wrap">
        <p class="section__kicker reveal in">статистика гильдии</p>
        <h1 class="section__title reveal in">Результаты <em>КВ и мясо</em></h1>
        <p class="section__sub reveal in">Последние матчи СОМНИИ против других гильдий. Реплеи и подробности — в нашем ТГК.</p>
      </div>
    </section>

    <section class="matches" aria-label="Лента матчей">
      <div class="wrap">
        <div id="matches" class="matches__grid">
          <p class="matches__loading">Загружаю матчи…</p>
        </div>
        <div class="matches__tg">
          <a class="btn btn--ghost" href="https://t.me/somni1aa" target="_blank" rel="noopener">
            <svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M21.9 4.6c.3-1.2-.9-2.2-2-1.7L2.7 9.9c-1.2.5-1.1 2.2.1 2.6l4.4 1.4 1.7 5.4c.3 1 1.6 1.3 2.3.5l2.4-2.5 4.5 3.3c.9.7 2.2.2 2.4-.9l2.4-15.1zM8.3 13.1l9.7-6.1c.3-.2.6.2.4.4l-8 7.5-.3 3.2-1.8-5z"/></svg>
            Все реплеи — в нашем ТГК
          </a>
        </div>
      </div>
    </section>
  </main>

  <footer class="footer">
    <div class="wrap footer__bottom">
      <span>© 2026 СОМНИЯ · <a href="index.html" style="color:inherit">на главную</a></span>
      <span>Фан-сайт гильдии. Не аффилирован с Garena.</span>
    </div>
  </footer>

  <script>
  (function () {
    var root = document.getElementById('matches');
    fetch('results.json?v=1', { cache: 'no-cache' })
      .then(function (r) { if (!r.ok) throw 0; return r.json(); })
      .then(function (data) {
        var matches = (data && data.matches) || [];
        if (!matches.length) { root.innerHTML = '<p class="matches__empty">Скоро здесь будут результаты — следи за нашим ТГК.</p>'; return; }
        root.innerHTML = matches.map(function (m) {
          var win = m.us > m.them;
          var badge = win
            ? '<span class="match__badge match__badge--win">Победа</span>'
            : '<span class="match__badge">Поражение</span>';
          return '<article class="match">'
            + '<div class="match__top"><span class="match__mode">' + (m.mode || 'Матч') + '</span>' + badge + '</div>'
            + '<div class="match__scoreline">'
            + '<span class="match__team match__team--us">СОМНИЯ</span>'
            + '<span class="match__score">' + m.us + ' : ' + m.them + '</span>'
            + '<span class="match__team">' + m.rival + '</span>'
            + '</div>'
            + (m.mvp ? '<p class="match__mvp"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 4h14v3h3v3c0 2.2-1.8 4-4 4h-.4A6 6 0 0113 17.7V19h3v2H8v-2h3v-1.3A6 6 0 016.4 14H6c-2.2 0-4-1.8-4-4V7h3V4zm-1 5v1c0 1.1.9 2 2 2h.1a9 9 0 01.6-3H4zm16 0h-2.7a9 9 0 01.6 3c1.1 0 2-.9 2-2V9z"/></svg>MVP — ' + m.mvp + '</p>' : '')
            + (m.date ? '<p class="match__date">' + m.date + '</p>' : '')
            + '</article>';
        }).join('');
      })
      .catch(function () {
        root.innerHTML = '<p class="matches__empty">Скоро здесь будут результаты — следи за нашим ТГК.</p>';
      });
  })();
  </script>
</body>
</html>
